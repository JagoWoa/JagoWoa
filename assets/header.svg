<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">José Luis Sarabia</title>
  <desc id="desc">Software Engineering Student and Web Developer</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1140" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0A0B"/>
      <stop offset="0.55" stop-color="#160D10"/>
      <stop offset="1" stop-color="#2A1018"/>
    </linearGradient>
    <linearGradient id="wine" x1="150" y1="42" x2="1030" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E1E33"/>
      <stop offset="1" stop-color="#BD6B7E"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
