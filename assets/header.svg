  <circle cx="1040" cy="80" r="126" fill="#7A1F35" fill-opacity=".22" filter="url(#glow)"/>
  <circle cx="1130" cy="300" r="172" stroke="#BD6B7E" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="1130" cy="300" r="126" stroke="#BD6B7E" stroke-opacity=".11" stroke-width="2"/>
  <path d="M900 0H1200V360H1040L900 0Z" fill="url(#wine)" fill-opacity=".07"/>

  <g transform="translate(74 76)">
